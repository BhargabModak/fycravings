<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Cravings – Late Night Food Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f3efe6; --muted:#c9d0c4; --amber:#ffc46b; --leaf:#8fd19e; --clay:#e08a5a;
  --glass:rgba(14,26,22,.55); --edge:rgba(255,255,255,.16);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#0d1512;color:var(--ink);font-family:Poppins,system-ui,sans-serif;line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.bg{position:fixed;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(12px) saturate(1.15);transform:scale(1.05)}
.tint{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,20,17,.70),rgba(16,34,27,.84))}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

.top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:clamp(1rem,3.4vw,1.35rem);color:var(--amber);letter-spacing:.01em}
.logo svg{flex:none}
.btn.small{padding:8px 18px;font-size:.9rem}
.hero{position:relative}
.hero{text-align:center;padding:110px 0 64px}
h1{margin:0;font-weight:800;font-size:clamp(2.4rem,9vw,5.4rem);line-height:1.04;letter-spacing:-.01em;
  color:var(--amber);text-shadow:0 0 34px rgba(255,196,107,.38)}
.sub{margin:18px 0 6px;font-weight:700;color:var(--ink);font-size:clamp(1.2rem,4vw,2rem)}
.for{margin:0;color:var(--leaf);font-weight:600;font-size:clamp(1rem,2.6vw,1.3rem)}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--amber);color:var(--ink);transition:transform .15s}
.btn.primary{background:var(--amber);color:#2a1d05}
.btn:hover{transform:translateY(-2px)}

section{padding:48px 0}
h2{margin:0 0 20px;color:var(--amber);font-weight:800;font-size:clamp(1.5rem,4vw,2.1rem)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px;padding:26px;border:1px solid var(--edge)}
.card h2{font-size:1.4rem;margin-bottom:12px}
.card ul{list-style:none;margin:0;padding:0}
.card li{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:baseline}
.card li:last-child{border:0}
.card b{color:var(--amber)}
.hot{border-color:rgba(224,138,90,.65)}

.order-grid{display:grid;gap:28px;grid-template-columns:1fr;align-items:start}
@media(min-width:880px){.order-grid{grid-template-columns:320px 1fr}}
.steps{margin:0 0 20px;padding-left:20px;color:var(--muted)}
.phone{display:block;margin-top:6px;font-size:1.5rem;font-weight:800;color:var(--amber);text-decoration:none}
.preview{display:block;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--edge);text-decoration:none;min-height:320px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.preview img{width:100%;height:100%;min-height:420px;object-fit:cover;display:block}
.preview .over{position:absolute;inset:auto 0 0 0;padding:70px 24px 24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;background:linear-gradient(transparent,rgba(10,20,17,.92));font-size:1.4rem}
.lead{margin:-8px 0 22px;color:var(--muted)}
.gallery{padding-top:8px}
.mosaic{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);grid-auto-rows:clamp(105px,27vw,150px);max-width:900px;margin:0 auto}
.tile{position:relative;margin:0;overflow:hidden;border-radius:20px;border:1px solid var(--edge);box-shadow:0 12px 32px rgba(0,0,0,.3);background:var(--glass)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.tile:hover img{transform:scale(1.06)}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 8px;font-weight:700;font-size:.85rem;background:linear-gradient(transparent,rgba(10,20,17,.88))}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.wide{grid-column:span 2}
.tile.round{border-radius:50%}
.tile.round figcaption{text-align:center;padding-bottom:18px}
@media(min-width:760px){.mosaic{grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(105px,12vw,150px)}}
.compare h2{text-align:center}
.vs{color:var(--clay);font-size:.8em;margin:0 .15em}
.cmp{max-width:900px;margin:0 auto;display:grid;gap:12px}
.cmp-head,.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-template-areas:"feat feat" "ours cafe"}
.cmp-head{grid-template-areas:"ours cafe";text-align:center;font-weight:800;line-height:1.25}
.h-feat{display:none}
.h-ours{color:var(--leaf);border-bottom:3px solid var(--leaf);padding-bottom:8px}
.h-cafe{color:var(--clay);border-bottom:3px solid var(--clay);padding-bottom:8px}
.cmp-row>div{padding:16px 14px;border-radius:18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--edge)}
.cmp-row .feat{grid-area:feat;padding:10px 14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;color:var(--amber);background:rgba(255,196,107,.1);border-color:rgba(255,196,107,.35)}
.cmp-row .ours{grid-area:ours;border-color:rgba(143,209,158,.5);box-shadow:0 0 22px rgba(143,209,158,.12)}
.cmp-row .cafe{grid-area:cafe;border-color:rgba(224,138,90,.45);color:var(--muted)}
.ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:800;font-size:.95rem}
.ours .ic{background:var(--leaf);color:#0d1512}
.cafe .ic{background:rgba(224,138,90,.25);color:var(--clay)}
.cmp small{color:var(--muted)}
@media(min-width:760px){
  .cmp-head,.cmp-row{grid-template-columns:1fr 210px 1fr;grid-template-areas:"ours feat cafe"}
  .cmp-head{align-items:end}
  .h-feat{display:block;grid-area:feat;color:var(--ink)}
  .cmp-row>div{min-height:92px}
  .cmp-row .feat{font-size:.85rem;background:rgba(255,196,107,.12)}
}
.note{margin:18px 0 0;color:var(--muted);font-size:.9rem}
footer{text-align:center;padding:28px 20px 40px;color:var(--muted);font-size:.9rem}
footer strong{color:var(--clay)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== UPI payment ===== */
.pay-grid{display:grid;gap:24px;grid-template-columns:1fr;align-items:start}

.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:600;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:1.05rem}
.field input::placeholder{color:rgba(243,239,230,.45)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--amber)}
button.btn{font:inherit;font-weight:700;cursor:pointer}
.btn.full{width:100%;text-align:center;font-size:1.1rem}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.apps a{padding:10px 6px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.07);text-align:center;font-weight:600;font-size:.9rem;text-decoration:none}
.apps a:hover{border-color:var(--amber)}
.payee{margin:14px 0 0;color:var(--muted);font-size:.9rem}
.payee b{color:var(--ink)}
.steps{margin:14px 0;padding-left:20px;color:var(--muted);font-size:.92rem;line-height:1.6}
.steps b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--amber);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.status{min-height:1.4em;margin:12px 0 0;color:var(--leaf);font-size:.92rem}

.qrcard h3{margin:0 0 4px;color:var(--amber);font-size:1.15rem}
.qrcard p{margin:0 0 14px;color:var(--muted);font-size:.88rem}
.qrlink{display:block;border-radius:20px;overflow:hidden;border:3px solid #fff;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:transform .15s}
.qrlink:hover{transform:scale(1.02)}
.qrlink img{display:block;width:100%;height:auto}
.qramt{margin-top:12px;font-weight:800;color:var(--amber);font-size:1.2rem;min-height:1.6em}

.menurow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.menurow input{width:64px;padding:8px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink);font:inherit}
.menurow.off{opacity:.5}
.tutorial{position:relative;z-index:3;padding:18px 0 0}
.tut-card{max-width:760px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:22px;padding:12px}
.tut-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 4px 10px}
.tut-head b{color:var(--amber);font-size:1.05rem}
.tut-head span{color:var(--muted);font-size:.85rem;flex:1}
.tut-wrap{position:relative}
.tut-card video{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;background:#000}
.sboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.sb{padding:10px 12px;border:1px solid var(--edge);border-radius:14px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:2px}
.sb b{font-size:1.6rem;line-height:1.1;color:var(--amber,#ffc266)}
.sb span{font-size:.85rem;color:var(--ink);line-height:1.25}
.sb small{color:var(--muted);font-size:.75rem}
.sb.out b{color:#ff8a80}
#adminTbl{border-collapse:collapse;width:100%;font-size:.85rem}
#adminTbl th,#adminTbl td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.brand{position:relative;z-index:3;text-align:center;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 0}
.brand a{display:inline-flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--amber)}
.brand svg{width:clamp(120px,34vw,190px);height:auto;filter:drop-shadow(0 8px 26px rgba(255,196,107,.28))}
.brand span{font-weight:800;font-size:clamp(1.5rem,6.5vw,2.7rem);line-height:1.1;letter-spacing:.01em;text-shadow:0 0 30px rgba(255,196,107,.35)}
.rsum{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.ravg{font-size:3rem;font-weight:800;line-height:1;color:var(--amber)}
.rstars{color:var(--amber);letter-spacing:.08em;font-size:1.25rem;line-height:1.2}
.rbars{flex:1;min-width:160px;display:grid;gap:4px}
.rbar{display:grid;grid-template-columns:22px 1fr 28px;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.rbar i{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.rbar i u{display:block;height:100%;background:var(--amber);text-decoration:none}
.pick{display:flex;gap:6px;margin:6px 0 14px}
.pick button{background:none;border:0;padding:2px;font-size:2.3rem;line-height:1;cursor:pointer;color:rgba(255,255,255,.28);transition:transform .12s,color .12s}
.pick button.on{color:var(--amber)}
.pick button:hover{transform:scale(1.15)}
.field textarea{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:1rem;min-height:84px;resize:vertical}
.review{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.review:last-child{border:0}
.review .rstars{font-size:1rem}
.review small{color:var(--muted)}
.review p{margin:4px 0 0;overflow-wrap:anywhere}
.closed{margin:0 0 22px;padding:18px 20px;border-radius:18px;border:1px solid rgba(255,138,128,.6);background:rgba(255,138,128,.12);text-align:center}
.closed b{display:block;color:#ff8a80;font-size:1.15rem;margin-bottom:4px}
.closed span{color:var(--ink)}
</style>
</head>
<body>
  <div class="wrap" style="padding: 40px 20px; text-align: center;">
    <h1>Midnight Cravings</h1>
    <p class="sub">Late Night Food Delivery</p>
    
    <div class="card" style="max-width: 500px; margin: 40px auto; text-align: left;">
      <h2>Order Menu & Checkout</h2>
      
      <!-- Menu item counters and selection -->
      <div class="menurow">
        <span>Maggi (₹50)</span>
        <input type="number" id="qty-maggi" min="0" value="0" data-price="50" data-name="Maggi">
      </div>
      <div class="menurow">
        <span>Cold Coffee (₹80)</span>
        <input type="number" id="qty-coffee" min="0" value="0" data-price="80" data-name="Cold Coffee">
      </div>
      
      <div style="margin-top: 20px;">
        <label class="field"><span>Your Name</span><input type="text" id="cust-name" placeholder="Enter your name"></label>
        <label class="field"><span>Phone Number</span><input type="tel" id="cust-phone" placeholder="Enter phone number"></label>
        <label class="field"><span>Delivery Address</span><input type="text" id="cust-address" placeholder="Hostel/Room No"></label>
      </div>

      <button class="btn primary full" style="margin-top: 20px;" onclick="handleCheckout()">Pay with Razorpay</button>
    </div>
  </div>

  <script>
    function getCartItems() {
      const items = [];
      const inputs = document.querySelectorAll('.menurow input');
      inputs.forEach(input => {
        const qty = parseInt(input.value) || 0;
        if (qty > 0) {
          items.push({
            name: input.getAttribute('data-name'),
            price: parseInt(input.getAttribute('data-price')),
            qty: qty
          });
        }
      });
      return items;
    }

    function getCartTotal() {
      const items = getCartItems();
      return items.reduce((sum, item) => sum + (item.price * item.qty), 0);
    }

    async function handleCheckout() {
      const cartItems = getCartItems();
      const totalAmount = getCartTotal();
      
      if (!cartItems || cartItems.length === 0) {
        alert("Please select at least one item from the menu!");
        return;
      }

      // 1. Request an order ID from your Cloudflare Worker
      const res = await fetch('https://fycravingspay.bhargabmodak2007.workers.dev/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: totalAmount })
      });
      const data = await res.json();
      
      if (!data.success) {
        alert("Failed to initiate payment. Try again.");
        return;
      }

      // 2. Open Razorpay Checkout Modal
      const options = {
        key: data.keyId,
        amount: data.amount,
        currency: "INR",
        name: "Midnight Cravings",
        description: "Late Night Delivery",
        order_id: data.orderId,
        handler: async function (response) {
          // 3. Send payment proof to your worker for automatic verification & Telegram alert
          const verifyRes = await fetch('https://fycravingspay.bhargabmodak2007.workers.dev/verify-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              cartDetails: cartItems,
              customerInfo: {
                name: document.getElementById('cust-name')?.value || "Guest",
                phone: document.getElementById('cust-phone')?.value || "N/A",
                address: document.getElementById('cust-address')?.value || "N/A"
              }
            })
          });
          
          const verifyData = await verifyRes.json();
          if (verifyData.status === 'success') {
            alert('Payment successful! Order sent directly to the kitchen.');
          } else {
            alert('Payment verification failed.');
          }
        },
        theme: { color: "#ffc46b" }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
</body>
</html>
